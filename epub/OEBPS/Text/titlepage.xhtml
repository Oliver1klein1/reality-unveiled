<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.1//EN" "http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>Reality Unveiled: Title Page</title>
    <link rel="stylesheet" type="text/css" href="../Styles/style.css"/>
    <style>
        :root {
            --primary-color: #2a4365;
            --secondary-color: #7f9cf5;
        }
        
        body {
            margin: 0;
            padding: 2rem;
            font-family: 'Playfair Display', serif;
            color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #fff;
        }
        .titlepage {
            text-align: center;
            max-width: 80%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: calc(100vh - 4rem);
        }
        h1 {
            font-size: 28pt;
            margin: 0 0 0.5in 0;
            line-height: 1.1;
        }
        h2 {
            font-size: 16pt;
            margin: 0 0 0.5in 0;
            font-weight: normal;
        }
        h3 {
            font-size: 14pt;
            margin: 0 0 0.25in 0;
            font-weight: normal;
            letter-spacing: 0.08em;
        }
        .publisher {
            font-size: 11pt;
            margin-top: 0.75in;
        }
        .navigation-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 3rem;
            padding: 1rem 0;
            border-top: 1px solid var(--secondary-color);
        }
        .nav-button {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }
        .nav-button:hover {
            background-color: var(--secondary-color);
        }
        @media print {
            @page {
                size: 6in 9in;
                margin: 0.75in;
            }
            body {
                font-family: Georgia, 'Times New Roman', Times, serif;
                font-size: 11.5pt;
                line-height: 1.6;
            }
            h1 { font-size: 24pt; }
            h2 { font-size: 14pt; }
            h3 { font-size: 12pt; }
            .navigation-buttons,
            .nav-button {
                display: none !important;
            }
        }
    </style>
</head>
<body>
<body>
<div class="titlepage">
<h1>Reality Unveiled</h1>
<h2>How Jesus Revealed You Are More Powerful Than You Ever Imagined</h2>
<h3>Ansilo Boff</h3>

</div>
</body>
</body>
</html>
