<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reality Unveiled: Dedication</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2a4365;
            --secondary-color: #7f9cf5;
            --accent-color: #f6ad55;
            --light-bg: #f7fafc;
            --dark-text: #2d3748;
            --light-text: #fff;
        }
        
        body {
            font-family: 'Merriweather', serif;
            color: var(--dark-text);
            line-height: 1.8;
            background-color: var(--light-bg);
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 0;
        }
        
        .dedication {
            padding: 3rem 2rem;
            font-size: 1.1rem;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 800px;
            margin: 0 auto;
        }
        
        .dedication-image {
            width: 100%;
            max-width: 600px;
            height: auto;
            margin: 0 auto 3rem;
            display: block;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .dedication-text {
            font-style: italic;
            text-align: center;
            line-height: 1.9;
            font-size: 1.15rem;
            color: var(--dark-text);
            max-width: 700px;
            margin: 0 auto;
        }
        
        .dedication-text p {
            margin-bottom: 1.5rem;
        }
        
        .navigation-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 3rem;
            padding: 1rem 0;
            border-top: 1px solid var(--secondary-color);
        }
        
        .nav-button {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }
        
        .nav-button:hover {
            background-color: var(--secondary-color);
        }

        /* Print-specific styles for PDF generation */
        @media print {
            @page {
                size: 6in 9in; /* Paperback and hardcover dimensions */
                margin: 0.75in;
            }
            
            body {
                font-family: Georgia, 'Times New Roman', Times, serif;
                font-size: 11pt;
                line-height: 1.6;
                color: #000;
                background: #fff;
                margin: 0;
                padding: 0;
            }
            
            /* Hide navigation */
            .navigation-buttons,
            nav,
            .navbar,
            .menu,
            .breadcrumb,
            .pagination,
            .nav-button,
            [class*="nav"],
            [class*="menu"],
            [class*="breadcrumb"] {
                display: none !important;
            }
            
            /* Preserve content styling */
            .bible-quote,
            .callout,
            .callout-quote,
            .highlight {
                display: block !important;
            }
            
            /* Ensure images print properly */
            img {
                max-width: 100% !important;
                height: auto !important;
                page-break-inside: avoid;
            }
            
            /* Make all quote classes black for printing */
            .chapter-quote,
            .bible-reference,
            .callout-quote,
            .callout-quote * {
                color: #000 !important;
            }
            
            /* Force all elements with inline color to be black when printing */
            [style*="color"] {
                color: #000 !important;
            }
            
            /* Typography */
            h1, h2, h3, h4, h5, h6 {
                page-break-after: avoid;
                page-break-inside: avoid;
                color: #000;
            }
            
            h1 {
                font-size: 20pt;
                margin-bottom: 0.75rem;
            }
            
            h2 {
                font-size: 16pt;
                margin-top: 1.25rem;
                margin-bottom: 0.5rem;
            }
            
            .callout-title {
                margin-bottom: 0.5rem !important;
                page-break-after: avoid;
            }
            
            p, li {
                page-break-inside: auto;
                orphans: 2;
                widows: 2;
                margin-bottom: 0.5rem;
            }
            
            /* Allow paragraphs inside callouts to break more freely */
            .callout p,
            .callout-quote p {
                page-break-inside: auto;
                orphans: 1;
                widows: 1;
            }
            
            /* Page breaks */
            .page-break {
                page-break-before: always;
            }
            
            .no-break {
                page-break-inside: avoid;
            }
            
            .chapter {
                page-break-before: always;
            }
            
            /* Allow callouts and info-boxes to break across pages */
            .callout,
            .callout-quote,
            .info-box {
                page-break-inside: auto;
            }
            
            .bullet-points,
            ul, ol {
                page-break-inside: auto;
            }
            
            /* Reduce margins on callout titles */
            .callout-title {
                margin-bottom: 0.5rem !important;
                page-break-after: avoid;
            }
            
            /* Reduce margins on callout-quotes */
            .callout-quote {
                margin: 1rem 0 !important;
                padding: 1rem !important;
            }
            
            /* Links */
            a {
                color: #000;
                text-decoration: none;
            }
            
            .dedication {
                min-height: auto;
                padding: 2rem 0;
            }
            
            .dedication-image {
                max-width: 80%;
                margin-bottom: 2rem;
            }
            
            .dedication-text {
                font-size: 12pt;
            }
        }
    </style>
</head>
<body>
    <div class="dedication">
        <img src="dedication_realityunveiled.jpg" alt="Dedication" class="dedication-image">
        
        <div class="navigation-buttons">
            <a href="copyright.html" class="nav-button">Previous: Copyright</a>
            <a href="toc.html" class="nav-button">Next: Table of Contents</a>
        </div>
    </div>
</body>
</html>
